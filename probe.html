<!doctype html>
<html>
<body>
<button id="btn" style="padding:20px;font-size:16px">选择目录</button>
<div id="out">waiting...</div>
<script>
  const o = document.getElementById('out')
  const base = { secure: window.isSecureContext, hasPicker: typeof window.showDirectoryPicker === 'function', proto: location.protocol }
  document.getElementById('btn').addEventListener('click', async () => {
    const r = Object.assign({}, base)
    try {
      const h = await window.showDirectoryPicker()
      r.name = h.name
      r.kind = h.kind
      const names = []
      for await (const [n, e] of h.entries()) { names.push(e.kind + ':' + n); if (names.length >= 10) break }
      r.entries = names
      const reqFile = await h.getFileHandle('requirements.txt').then(() => 'yes').catch(() => 'no')
      r.hasRequirements = reqFile
      o.textContent = 'RESULT ' + JSON.stringify(r)
    } catch (e) {
      r.error = String((e && e.name) || e)
      o.textContent = 'RESULT ' + JSON.stringify(r)
    }
  })
</script>
</body>
</html>
